# ===================================================================
# Server Configuration
# ===================================================================
server:
  port: ${PORT:8080}
  address: 0.0.0.0
  compression:
    enabled: true
  error:
    include-stacktrace: never

# ===================================================================
# Spring Core Configuration
# ===================================================================
spring:
  application:
    name: refind

  main:
    allow-bean-definition-overriding: true

  # Jackson JSON Serialization
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    time-zone: UTC
    deserialization:
      read-unknown-enum-values-as-null: true

  # Database Datasource & Connection Pooling
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:refind_db}?sslmode=${SSL_MODE:disable}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariReFindPool
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      idle-timeout: 30000
      max-lifetime: 2000000
      connection-timeout: 30000
      auto-commit: true
      transaction-isolation: TRANSACTION_READ_COMMITTED

  # Database Migrations (Flyway)
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    repair-on-migrate: true
    baseline-on-migrate: true
    validate-migration-naming: true
    ignore-unsupported-database: true
    locations: "classpath:db/migration"
    default-schema: public
    schemas: public

  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: ${HIBERNATE_SHOW_SQL:false}
    open-in-view: false
    properties:
      default_schema: public
      hibernate:
        format_sql: true
      jdbc:
        time_zone: UTC

  # Multipart / File Uploads
  servlet:
    multipart:
      enabled: true
      location: ${MULTIPART_TMP_DIR:/tmp}
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:30MB}
      resolve-lazily: false

  # Redis (Upstash compatible)
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

# ===================================================================
# Storage Configuration (Local Filesystem)
# ===================================================================
storage:
  provider: local
  local:
    base-dir: ${UPLOAD_DIR:./uploads}
    items-dir: ${UPLOAD_ITEMS_DIR:items}
    avatars-dir: ${UPLOAD_AVATARS_DIR:avatars}
  allowed-formats: ${UPLOAD_ALLOWED_FORMATS:image/jpeg,image/png,image/webp}

# ===================================================================
# Application & Security Configuration
# ===================================================================
app:
  security:
    jwt:
      secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000} # 24 hours
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    api-key: ${API_KEY:}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
  admin:
    bootstrap-emails: ${APP_ADMIN_BOOTSTRAP_EMAILS:}

# ===================================================================
# Push Notifications (Firebase Cloud Messaging)
# ===================================================================
firebase:
  fcm:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
    credentials-json: ${FIREBASE_CONFIG_JSON:}
  client-api-key: ${FIREBASE_CLIENT_API_KEY:}

# ===================================================================
# Email Delivery (Resend)
# ===================================================================
resend:
  api:
    key: ${RESEND_API_KEY:}
    url: ${RESEND_API_URL:https://api.resend.com}
  from:
    email: ${RESEND_FROM_EMAIL:no-reply@refind.app}
    name: ${RESEND_FROM_NAME:ReFind}

# ===================================================================
# Actuator & Observability
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      access: read_only

# ===================================================================
# Logging
# ===================================================================
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springdoc: WARN
    com.shariarunix.refind: DEBUG

# ===================================================================
# OpenAPI / Swagger Documentation
# ===================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
  packages-to-scan: com.shariarunix.refind
  paths-to-match: /api/**
